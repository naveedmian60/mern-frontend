<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Shopping Bag Icon with "SZ" - Transparent Background -->
  
  <!-- Bag body -->
  <rect x="12" y="20" width="40" height="36" rx="4" ry="4" fill="#4F46E5"/>
  
  <!-- Bag handle -->
  <path d="M22 20 V14 A10 10 0 0 1 42 14 V20" stroke="#4F46E5" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Inner highlight stripe -->
  <rect x="12" y="46" width="40" height="10" rx="0" ry="0" fill="#3730A3" opacity="0.5"/>
  
  <!-- "S" letter -->
  <text x="24" y="46" font-family="Arial Black, Arial, sans-serif" font-size="18" font-weight="900" fill="white" text-anchor="middle">S</text>
  
  <!-- "Z" letter -->
  <text x="40" y="46" font-family="Arial Black, Arial, sans-serif" font-size="18" font-weight="900" fill="white" text-anchor="middle">Z</text>
</svg>